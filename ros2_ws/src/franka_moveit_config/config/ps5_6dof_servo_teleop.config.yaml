ps5_6dof_servo_teleop_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9
    enable_turbo_button: 10
    rotation_mode_axis: 4
    rotation_mode_button: -1
    rotation_mode_threshold: 0.5

    axis_linear:
      x: 1
      y: 0
      z: 3
    scale_linear:
      x: 0.10
      y: 0.10
      z: -0.08
    scale_linear_turbo:
      x: 0.20
      y: 0.20
      z: -0.12

    axis_angular:
      roll: 0
      pitch: 1
      yaw: 2
    scale_angular:
      roll: 0.30
      pitch: 0.30
      yaw: 0.30
    scale_angular_turbo:
      roll: 0.60
      pitch: 0.60
      yaw: 0.60
