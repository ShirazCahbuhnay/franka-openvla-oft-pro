/**:
  ros__parameters:
    # --- Device Allocation ---
    video_device: "/dev/video0"
    camera_name: "vla_front_camera"
    camera_frame_id: "camera_link_optical"

    # --- Stream Configurations ---
  
    image_width: 1024
    image_height: 768
    framerate: 10.0
    io_method: "mmap"
    pixel_format: "mjpeg2rgb" 
    output_encoding: "rgb8"

    # --- LOCKED HARDWARE SETTINGS (Optimized for VLA Data Collection) ---
    
    # 1. White Balance Management
    white_balance_automatic: true          # default=1 value=1
    white_balance_temperature: 4600        # min=2800 max=6500 step=1 default=4600 value=4600 flags=inactive

    # 2. Exposure Control 
    auto_exposure: 1                       # min=0 max=3 default=3 value=3 (Aperture Priority Mode)
    exposure_time_absolute: 157            # min=1 max=5000 step=1 default=157 value=157 flags=inactive
    exposure_dynamic_framerate: false      # default=0 value=1

    # 3. Standard Processing Controls 
    brightness: 0                          # min=-64 max=64 step=1 default=0 value=0
    contrast: 32                           # min=0 max=64 step=1 default=32 value=32
    saturation: 64                         # min=0 max=128 step=1 default=64 value=64
    hue: 0                                 # min=-40 max=40 step=1 default=0 value=0
    gamma: 100                             # min=72 max=500 step=1 default=100 value=100
    gain: 0                               # min=0 max=100 step=1 default=0 value=0
    sharpness: 3                           # min=0 max=6 step=1 default=3 value=3
    backlight_compensation: 1              # min=0 max=2 step=1 default=1 value=1

    # 4. Anti-Flicker (Power Line Frequency)
    power_line_frequency: 2                # min=0 max=2 default=2 value=2 (60 Hz)

    # 5. Motorized PTZ Controls (Hardware Specific Features)
    # These parameters position the camera physical mount if equipped with a gimbal motor
    pan_absolute: 0                        # min=-36000 max=36000 step=3600 default=0 value=0
    tilt_absolute: 0                       # min=-36000 max=36000 step=3600 default=0 value=0
    zoom_absolute: 0                       # min=0 max=9 step=1 default=0 value=0
    
    # --- Calibration Registry ---
    camera_info_url: "package://vla_data_collection/config/vla_front_camera_intrinsics.yaml"
