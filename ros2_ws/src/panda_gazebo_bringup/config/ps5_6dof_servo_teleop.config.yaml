    enable_button: 9
    enable_turbo_button: 10
    rotation_mode_axis: 4
    rotation_mode_button: -1
    rotation_mode_threshold: 0.5

    axis_linear:
      x: 1
      y: 0
      z: 3
    scale_linear:
      x: 0.18
      y: 0.18
      z: -0.14
    scale_linear_turbo:
      x: 0.30
      y: 0.30
      z: -0.22

    axis_angular:
      roll: 0
      pitch: 1
      yaw: 2
    scale_angular:
      roll: 0.50
      pitch: 0.50
      yaw: 0.50
    scale_angular_turbo:
      roll: 0.90
      pitch: 0.90
      yaw: 0.90
